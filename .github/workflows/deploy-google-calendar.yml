name: Publicar Supabase

# Publica as edge functions (e, quando possivel, as migracoes) no projeto
# Supabase a cada push na main.
#
# Historico: a versao anterior deste arquivo exigia quatro secrets e, quando
# faltava qualquer um, marcava ready=false e PULAVA todas as etapas sem falhar.
# O Actions ficava verde sem ter publicado nada. Nenhum secret estava
# cadastrado no repositorio, entao nenhum push jamais publicou: as funcoes
# ficaram meses rodando uma versao antiga, o que causou 15.155 eventos
# duplicados no Google Agenda em 22/09/2026 e um invalid_client em 27/09/2026.
#
# Mudancas desta versao:
#   1. Falha ALTO quando falta o token (exit 1), em vez de pular em silencio.
#   2. Publica TODAS as funcoes de supabase/functions/, em vez de uma lista
#      fixa escrita a mao que nao incluia funcoes novas.
#   3. Aplica as migracoes com db push, quando a senha do banco existir.
#   4. NAO reescreve mais os secrets do Supabase. Eles ja estao corretos no
#      projeto, e sobrescrever APP_USER_CONNECTION_KEY_SECRET com um valor
#      diferente tornaria ilegivel o refresh token do Google ja guardado,
#      derrubando a conexao. Para trocar um secret, use o painel do Supabase.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-google-calendar.yml"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: jaffscdivzjzcmvjkwss

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar token de acesso
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            {
              echo "### Deploy NAO executado"
              echo ""
              echo "Falta o Repository secret **SUPABASE_ACCESS_TOKEN**."
              echo ""
              echo "Gere um token em https://supabase.com/dashboard/account/tokens"
              echo "e cadastre em Settings > Secrets and variables > Actions."
              echo ""
              echo "Enquanto esse secret nao existir, NENHUM push publica as"
              echo "edge functions, e o app continua rodando a versao antiga."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::SUPABASE_ACCESS_TOKEN ausente. Deploy abortado." >&2
            exit 1
          fi
          echo "Token presente."

      - name: Baixar repositorio
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Aplicar migracoes
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            {
              echo "### Migracoes NAO aplicadas"
              echo ""
              echo "Falta o Repository secret **SUPABASE_DB_PASSWORD**."
              echo "As edge functions foram publicadas, mas nenhuma migracao"
              echo "de banco foi aplicada. Tabelas e colunas novas nao existem"
              echo "no projeto ate que esse secret seja cadastrado."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SUPABASE_DB_PASSWORD ausente; migracoes puladas."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
          echo "Migracoes aplicadas." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar todas as edge functions
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          falhas=0
          publicadas=0
          for dir in supabase/functions/*/; do
            function_name="$(basename "$dir")"
            # _shared nao e uma funcao: e codigo importado pelas outras.
            case "$function_name" in _*) continue ;; esac
            echo "::group::$function_name"
            if supabase functions deploy "$function_name" \
                 --project-ref "$SUPABASE_PROJECT_REF"; then
              publicadas=$((publicadas + 1))
            else
              echo "::error::Falha ao publicar $function_name" >&2
              falhas=$((falhas + 1))
            fi
            echo "::endgroup::"
          done
          {
            echo "### Edge functions"
            echo ""
            echo "Publicadas: $publicadas"
            echo "Falhas: $falhas"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$falhas" -gt 0 ]; then
            exit 1
          fi

      - name: Validar callback publicado
        shell: bash
        env:
          CALLBACK_URL: https://jaffscdivzjzcmvjkwss.supabase.co/functions/v1/google-oauth-callback
        run: |
          status="$(curl --silent --show-error --output /tmp/google-callback-response --write-out '%{http_code}' "$CALLBACK_URL")"
          if [ "$status" != "400" ]; then
            echo "::error::Callback respondeu HTTP $status; esperado 400 sem state." >&2
            sed -n '1,20p' /tmp/google-callback-response >&2
            exit 1
          fi
          echo "Callback respondendo como esperado." >> "$GITHUB_STEP_SUMMARY"
